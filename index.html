<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LITOR Surf Widget Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F6F3ED;
            color: #1F1B17;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid #E8E2D6;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .header {
            font-size: 24px;
            color: #9FB3C4;
            margin-bottom: 10px;
        }

        .spot-name {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0;
        }

        .condition {
            font-size: 20px;
            color: #2F4A3A;
        }

        .details {
            margin: 20px 0;
        }

        .card {
            padding: 10px;
            margin: 10px 0;
            background-color: #E8E2D6;
            border-radius: 8px;
        }

        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">LITOR SURF</div>
        <div class="spot-name">Praia da Pipa</div>

        <div class="condition">
            BOM 7.8/10
        </div>

        <div class="details">
            <div class="card">
                <strong>Ondulação:</strong> 1.1 m / 11 s / E-SE
            </div>
            <div class="card">
                <strong>Vento:</strong> 8 nós / terral
            </div>
            <div class="card">
                <strong>Maré:</strong> 0.6 m / subindo
            </div>
            <div class="card">
                <strong>Melhor horário:</strong> 05:40–08:10
            </div>
        </div>

        <div class="footer">
            Atualizado às 05:15
        </div>
    </div>
</body>
</html>
